paper: "DART-SQL: Dynamic Action Routing for Text-to-SQL"
artifact_scope: "prompt templates and selected verified settings"

search:
  nominal_path_budget: 24

routing:
  epsilon_route: 0.5
  initial_action_score: 5.0
  selector_temperature: 0.3
  selector_parse_attempts: 3
  fallback_softmax_temperature: 1.0

retrieval:
  edit_similarity_threshold: 0.3
  semantic_similarity_threshold: 0.6

candidate_generation:
  candidates_per_generation_or_revision_action: 5

tuning_protocol:
  tuned_on: "BIRD training split"
  frozen_before: "final BIRD development-set evaluation"
  transferred_without_retuning_to: "Spider development set"

